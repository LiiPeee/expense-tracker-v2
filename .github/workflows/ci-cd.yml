name: CI / CD – BudgetTracker

on:
  pull_request:
    branches: [main] # build + testes em todo PR para main
  push:
    branches: [main] # deploy em produção após merge

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Build & Test (roda em PRs e em push para main)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: dotnet test Test/Test.csproj --no-build -c Release --verbosity normal

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Deploy para produção no Render (só após merge na main)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Render (production)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
